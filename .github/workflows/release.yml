name: Release

# Publishes the package to nuget.org when a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The version comes from the tag. It uses nuget.org Trusted Publishing: GitHub proves the identity of this
# workflow with a short-lived OIDC token, so no NuGet API key is stored in the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub release
  id-token: write # OIDC token for nuget.org Trusted Publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  LIBRARY: src/Plugin.Maui.SharedTransitions/Plugin.Maui.SharedTransitions.csproj

jobs:
  publish:
    name: Pack and publish
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Windows builds every target framework (Android, iOS, Mac Catalyst, Windows), so a single job packs them all.
      - name: Pack
        run: dotnet pack ${{ env.LIBRARY }} -c Release -warnaserror -p:Version=${{ env.VERSION }} -o artifacts

      - uses: actions/upload-artifact@v5
        with:
          name: nuget
          path: artifacts/*

      - name: Log in to nuget.org
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg next to the .nupkg is pushed automatically.
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$VERSION" --generate-notes $prerelease
