name: CI

# Library for every target framework + Android sample, on pull requests and merges to main.
# iOS and Mac Catalyst are built by macos.yml, which doesn't run on pull requests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every merge to main is built.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  LIBRARY: src/Plugin.Maui.SharedTransitions/Plugin.Maui.SharedTransitions.csproj
  SAMPLE: samples/SharedTransitions.Sample/SharedTransitions.Sample.csproj

jobs:
  windows:
    name: Windows (library + Android sample + pack)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build library (all target frameworks)
        run: dotnet build ${{ env.LIBRARY }} -c Release -warnaserror

      - name: Build Android sample
        run: dotnet build ${{ env.SAMPLE }} -c Release -f net10.0-android

      - name: Pack
        run: dotnet pack ${{ env.LIBRARY }} -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v5
        with:
          name: nuget
          path: artifacts/*.nupkg
