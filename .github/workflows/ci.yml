name: CI

# Pull requests only run the Windows job (library + Android) to keep them fast;
# merges to main also build iOS and Mac Catalyst on macOS.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: Also build iOS / Mac Catalyst (macOS runners can queue for a long time)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every merge to main is built.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  LIBRARY: src/Plugin.Maui.SharedTransitions/Plugin.Maui.SharedTransitions.csproj
  SAMPLE: samples/SharedTransitions.Sample/SharedTransitions.Sample.csproj

jobs:
  windows:
    name: Windows (library + Android sample + pack)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build library (all target frameworks)
        run: dotnet build ${{ env.LIBRARY }} -c Release -warnaserror

      - name: Build Android sample
        run: dotnet build ${{ env.SAMPLE }} -c Release -f net10.0-android

      - name: Pack
        run: dotnet pack ${{ env.LIBRARY }} -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v5
        with:
          name: nuget
          path: artifacts/*.nupkg

  macos:
    name: macOS (iOS + Mac Catalyst)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Pinned to the last workload set whose .NET for iOS works with the Xcode shipped by the runner
      # image (10.0.402+ requires Xcode 27). Bump it when the image gets a newer Xcode.
      - name: Install workloads
        run: dotnet workload install maui --version 10.0.401

      - name: Build library (iOS + Mac Catalyst)
        run: |
          dotnet build ${{ env.LIBRARY }} -c Release -f net10.0-ios -warnaserror
          dotnet build ${{ env.LIBRARY }} -c Release -f net10.0-maccatalyst -warnaserror

      - name: Build iOS sample (simulator)
        run: dotnet build ${{ env.SAMPLE }} -c Debug -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64

      - name: Build Mac Catalyst sample
        run: dotnet build ${{ env.SAMPLE }} -c Debug -f net10.0-maccatalyst
