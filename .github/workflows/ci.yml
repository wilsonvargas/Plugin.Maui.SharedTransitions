name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  LIBRARY: src/Plugin.Maui.SharedTransitions/Plugin.Maui.SharedTransitions.csproj
  SAMPLE: samples/SharedTransitions.Sample/SharedTransitions.Sample.csproj

jobs:
  windows:
    name: Windows (library + Android sample + pack)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build library (all target frameworks)
        run: dotnet build ${{ env.LIBRARY }} -c Release -warnaserror

      - name: Build Android sample
        run: dotnet build ${{ env.SAMPLE }} -c Release -f net10.0-android

      - name: Pack
        run: dotnet pack ${{ env.LIBRARY }} -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg

  macos:
    name: macOS (iOS + Mac Catalyst)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workloads
        run: dotnet workload install maui-ios maui-maccatalyst

      - name: Build library (iOS + Mac Catalyst)
        run: |
          dotnet build ${{ env.LIBRARY }} -c Release -f net10.0-ios -warnaserror
          dotnet build ${{ env.LIBRARY }} -c Release -f net10.0-maccatalyst -warnaserror

      - name: Build iOS sample (simulator)
        run: dotnet build ${{ env.SAMPLE }} -c Debug -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64

      - name: Build Mac Catalyst sample
        run: dotnet build ${{ env.SAMPLE }} -c Debug -f net10.0-maccatalyst
